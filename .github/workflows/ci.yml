name: CI Build

# Verification workflow. Does not deploy or require production secrets.
# Required status check on `master` (see branch protection).
#
# Triggers:
#   - pull_request: every PR (path-filtered to skip docs-only changes)
#   - push to master: every commit to the default branch
#   - workflow_dispatch: manual re-run
#
# Cost controls:
#   - `paths-ignore` keeps docs/markdown-only changes from spending minutes
#   - `concurrency.cancel-in-progress` drops superseded runs on the same ref
on:
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'CHANGES_SUMMARY.md'
      - 'DEPLOYMENT_*.md'
      - 'DEPLOY_*.md'
      - 'AUTHENTICATION_*.md'
      - 'CORE_FEATURES_*.md'
      - 'DASHBOARD_*.md'
      - 'CHANGES_*.md'
      - '.github/ashbi-local-ci-validation.md'
      - 'dev_server.log'
  push:
    branches: [master]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'CHANGES_SUMMARY.md'
      - 'DEPLOYMENT_*.md'
      - 'DEPLOY_*.md'
      - 'AUTHENTICATION_*.md'
      - 'CORE_FEATURES_*.md'
      - 'DASHBOARD_*.md'
      - 'CHANGES_*.md'
      - '.github/ashbi-local-ci-validation.md'
      - 'dev_server.log'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit and readiness tests
        run: npm test

      - name: Install browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Browser smoke tests
        run: npm run test:e2e
