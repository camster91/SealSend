name: CI Build

# Canonical verification workflow. Does not deploy or require production secrets.
# Fast checks run for every relevant PR; the expensive five-project Playwright
# browser matrix is skipped for Dependabot because dependency PRs are already
# covered by audit, typecheck, lint, and unit/readiness tests.

on:
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'CHANGES_SUMMARY.md'
      - 'DEPLOYMENT_*.md'
      - 'DEPLOY_*.md'
      - 'AUTHENTICATION_*.md'
      - 'CORE_FEATURES_*.md'
      - 'DASHBOARD_*.md'
      - 'CHANGES_*.md'
      - '.github/ashbi-local-ci-validation.md'
      - 'dev_server.log'
  push:
    branches: [master]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'CHANGES_SUMMARY.md'
      - 'DEPLOYMENT_*.md'
      - 'DEPLOY_*.md'
      - 'AUTHENTICATION_*.md'
      - 'CORE_FEATURES_*.md'
      - 'DASHBOARD_*.md'
      - 'CHANGES_*.md'
      - '.github/ashbi-local-ci-validation.md'
      - 'dev_server.log'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit and readiness tests
        run: npm test

      - name: Build (standalone)
        run: npm run build

      - name: Install browsers
        if: github.actor != 'dependabot[bot]'
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Browser smoke tests
        if: github.actor != 'dependabot[bot]'
        run: npm run test:e2e

