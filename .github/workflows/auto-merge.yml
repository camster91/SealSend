name: Auto Merge

# DISABLED: automatic triggers removed due to GitHub Actions billing limits.
# Re-enable by restoring pull_request_target trigger below.

on:
  workflow_dispatch:

jobs:
  auto-merge:
    if: contains(github.event.pull_request.labels.*.name, 'auto-merge')
    runs-on: ubuntu-latest
    steps:
      - uses: pascalgn/automerge-action@v0.16.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MERGE_LABELS: "auto-merge"
          MERGE_DELETE_BRANCH: true
          MERGE_FORKS: false
          MERGE_METHOD: squash
          MERGE_RETRIES: 5
          MERGE_RETRY_SLEEP: 60000
