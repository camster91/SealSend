name: Lint

# Fast lint feedback on PRs and pushes to `master`. Runs in parallel with
# `ci.yml` (which also lints) to surface lint errors before the heavier
# typecheck / build / e2e steps complete.
#
# Triggers:
#   - pull_request: every PR (path-filtered to skip docs-only changes)
#   - push to master: every commit to the default branch
#   - workflow_dispatch: manual re-run
#
# No deploy, no production secrets, no concurrency concerns.
on:
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'CHANGES_SUMMARY.md'
      - 'DEPLOYMENT_*.md'
      - 'DEPLOY_*.md'
      - 'AUTHENTICATION_*.md'
      - 'CORE_FEATURES_*.md'
      - 'DASHBOARD_*.md'
      - 'CHANGES_*.md'
      - '.github/ashbi-local-ci-validation.md'
      - 'dev_server.log'
  push:
    branches: [master]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'CHANGES_SUMMARY.md'
      - 'DEPLOYMENT_*.md'
      - 'DEPLOY_*.md'
      - 'AUTHENTICATION_*.md'
      - 'CORE_FEATURES_*.md'
      - 'DASHBOARD_*.md'
      - 'CHANGES_*.md'
      - '.github/ashbi-local-ci-validation.md'
      - 'dev_server.log'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run lint
        run: npm run lint
        env:
          CI: true
