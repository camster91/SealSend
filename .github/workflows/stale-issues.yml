name: Stale Issues

# Marks issues inactive for 30+ days as stale, closes 7 days after that.
# Scheduled weekly (Sunday 00:00 UTC) to minimize Actions minutes.
# Exempt labels: pinned, security, enhancement, bug, priority-critical, schema-drift.
on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

permissions:
  issues: write
  contents: read

concurrency:
  group: stale-issues
  cancel-in-progress: true

jobs:
  stale:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/stale@v9
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          stale-issue-message: "This issue has been inactive for 30 days. Auto-closing."
          days-before-stale: 30
          days-before-close: 7
          stale-issue-label: stale
          exempt-issue-labels: pinned,security,enhancement,bug,priority-critical,schema-drift
          operations-per-run: 50
