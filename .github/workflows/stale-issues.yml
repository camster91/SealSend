name: Stale Issues

# DISABLED: scheduled trigger removed due to GitHub Actions billing limits.
# Re-enable by restoring the cron schedule below.

on:
  workflow_dispatch:

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v9
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          stale-issue-message: "This issue has been inactive for 30 days. Auto-closing."
          days-before-stale: 30
          days-before-close: 7
          stale-issue-label: stale
          exempt-issue-labels: pinned,security,enhancement,bug,priority-critical,schema-drift
          operations-per-run: 50
