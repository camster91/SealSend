name: iOS native compilation

on:
  workflow_dispatch:
  push:
    branches: [feat/native-mobile-apps]
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/ios-native.yml'

permissions:
  contents: read

concurrency:
  group: ios-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    name: iOS simulator native assembly
    runs-on: macos-26
    timeout-minutes: 45
    env:
      CI: 'true'
      EXPO_NO_TELEMETRY: '1'
      EXPO_PUBLIC_API_URL: https://sealsend.app
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Record Xcode toolchain
        run: xcodebuild -version
      - run: npm ci --no-audit --no-fund
      - run: npm ci --prefix apps/mobile --no-audit --no-fund
      - name: Generate iOS project from checked-in Expo configuration
        working-directory: apps/mobile
        run: ./node_modules/.bin/expo prebuild --platform ios --no-install
      - name: Install native dependencies
        working-directory: apps/mobile/ios
        run: pod install
      - name: Compile unsigned release-mode simulator candidate
        working-directory: apps/mobile/ios
        run: >-
          xcodebuild -workspace SealSend.xcworkspace -scheme SealSend
          -configuration Release -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath "$RUNNER_TEMP/sealsend-ios-derived"
          -jobs 2 CODE_SIGNING_ALLOWED=NO build
      - name: Record assembly evidence
        shell: bash
        run: |
          app="$RUNNER_TEMP/sealsend-ios-derived/Build/Products/Release-iphonesimulator/SealSend.app"
          test -s "$app/SealSend"
          test -s "$app/main.jsbundle"
          test -s "$app/Info.plist"
          file "$app/SealSend"
          lipo -verify_arch arm64 "$app/SealSend"
          shasum -a 256 "$app/SealSend" "$app/main.jsbundle"
          python3 - <<'PY'
          from pathlib import Path
          import json
          import os
          import plistlib
          app = Path(os.environ['RUNNER_TEMP']) / 'sealsend-ios-derived/Build/Products/Release-iphonesimulator/SealSend.app'
          with (app / 'Info.plist').open('rb') as file:
              info = plistlib.load(file)
          with Path('apps/mobile/app.json').open() as file:
              expected = json.load(file)['expo']['ios']['bundleIdentifier']
          assert info['CFBundleIdentifier'] == expected, 'Unexpected application identity'
          assert isinstance(info.get('NSCameraUsageDescription'), str) and info['NSCameraUsageDescription'].strip()
          blocked = ['NSMicrophoneUsageDescription', 'NSContactsUsageDescription', 'NSCalendarsUsageDescription',
                     'NSCalendarsFullAccessUsageDescription', 'NSCalendarsWriteOnlyAccessUsageDescription',
                     'NSLocationWhenInUseUsageDescription', 'NSLocationAlwaysUsageDescription',
                     'NSLocationAlwaysAndWhenInUseUsageDescription', 'NSPhotoLibraryUsageDescription',
                     'NSPhotoLibraryAddUsageDescription', 'NSFaceIDUsageDescription']
          assert not any(info.get(key) for key in blocked), 'Unexpected sensitive permission usage description'
          manifests = []
          for path in sorted(app.rglob('PrivacyInfo.xcprivacy')):
              with path.open('rb') as file:
                  data = plistlib.load(file)
              assert not data.get('NSPrivacyTracking'), f'Unexpected tracking declaration: {path.name}'
              manifests.append({'path': str(path.relative_to(app)), 'declarations': data})
          assert manifests, 'Packaged privacy manifest inspection is required'
          print(json.dumps({'bundleIdentifier': expected, 'cameraDescription': info['NSCameraUsageDescription'],
                            'packagedPrivacyManifests': manifests}, indent=2))
          PY
          {
            echo '### iOS compilation evidence'
            echo "Source: $GITHUB_SHA"
            echo 'Unsigned release-mode simulator app assembled on a standard macOS runner.'
            echo 'This is compilation proof, not TestFlight signing, device QA, or a beta release.'
            echo 'App is not retained/uploaded; no build artifact storage is added by this workflow.'
          } >> "$GITHUB_STEP_SUMMARY"
