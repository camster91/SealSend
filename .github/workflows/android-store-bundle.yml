name: Android store bundle candidate

on:
  workflow_dispatch:
  push:
    branches: [ci/testflight-device-archive]
    paths: ['.github/workflows/android-store-bundle.yml', 'scripts/mobile/**', 'apps/mobile/app.json']

permissions:
  contents: read

concurrency:
  group: android-store-bundle-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android unsigned store bundle assembly
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CI: 'true'
      EXPO_NO_TELEMETRY: '1'
      EXPO_PUBLIC_API_URL: https://sealsend.app
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci --no-audit --no-fund
      - run: npm ci --prefix apps/mobile --no-audit --no-fund
      - name: Generate Android project from checked-in Expo configuration
        working-directory: apps/mobile
        run: ./node_modules/.bin/expo prebuild --platform android --no-install
      - name: Compile release-mode ARM64 app bundle
        working-directory: apps/mobile/android
        run: ./gradlew bundleRelease --no-daemon --max-workers=2 -PreactNativeArchitectures=arm64-v8a
      - name: Download checksum-pinned bundletool for AAB manifest verification
        shell: bash
        run: |
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/bundletool.jar" \
            https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar
          echo "a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29  $RUNNER_TEMP/bundletool.jar" | sha256sum --check --strict
      - name: Android provenance regression tests
        run: python3 -m unittest discover -s scripts/mobile/tests -v
      - name: Verify bundle contents and remove generated development signature
        run: python3 scripts/mobile/verify-android-bundle.py --bundletool "$RUNNER_TEMP/bundletool.jar"
      - name: Retain bundle for owner upload signing
        uses: actions/upload-artifact@v4
        with:
          name: sealsend-android-${{ github.sha }}
          path: ${{ runner.temp }}/sealsend-android-artifact/
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
