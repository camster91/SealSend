name: Android native compilation

on:
  workflow_dispatch:
  push:
    branches: [feat/native-mobile-apps]
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/android-native.yml'

permissions:
  contents: read

concurrency:
  group: android-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android native APK assembly
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CI: 'true'
      EXPO_NO_TELEMETRY: '1'
      EXPO_PUBLIC_API_URL: https://sealsend.app
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci --no-audit --no-fund
      - run: npm ci --prefix apps/mobile --no-audit --no-fund
      - name: Generate Android project from checked-in Expo configuration
        working-directory: apps/mobile
        run: ./node_modules/.bin/expo prebuild --platform android --no-install
      - name: Compile release-mode ARM64 device candidate
        working-directory: apps/mobile/android
        run: ./gradlew assembleRelease --no-daemon --max-workers=2 -PreactNativeArchitectures=arm64-v8a
      - name: Record assembly evidence
        shell: bash
        run: |
          apk=apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          test -s "$apk"
          sha256sum "$apk"
          python3 - <<'PY'
          from zipfile import ZipFile
          from pathlib import Path
          import os
          import subprocess
          apk = Path('apps/mobile/android/app/build/outputs/apk/release/app-release.apk')
          with ZipFile(apk) as archive:
              entries = archive.namelist()
          assert 'assets/index.android.bundle' in entries, 'Missing embedded JS bundle'
          assert any(name.startswith('lib/arm64-v8a/libhermes') for name in entries), 'Missing ARM64 Hermes runtime'
          abis = {name.split('/')[1] for name in entries if name.startswith('lib/') and name.endswith('.so')}
          assert abis == {'arm64-v8a'}, f'Unexpected ABI set: {abis}'
          print('Verified embedded JS, Hermes and ARM64-only native libraries')
          aapt_tools = sorted(Path(os.environ['ANDROID_HOME']).glob('build-tools/*/aapt2'))
          assert aapt_tools, 'Android SDK manifest inspection tool is required'
          permissions = subprocess.check_output([str(aapt_tools[-1]), 'dump', 'permissions', str(apk)], text=True)
          assert "'android.permission.CAMERA'" in permissions, 'Missing optional scanner camera declaration'
          blocked = ['RECORD_AUDIO', 'READ_CONTACTS', 'WRITE_CONTACTS', 'READ_CALENDAR', 'WRITE_CALENDAR',
                     'READ_EXTERNAL_STORAGE', 'WRITE_EXTERNAL_STORAGE', 'READ_MEDIA_IMAGES',
                     'READ_MEDIA_VIDEO', 'READ_MEDIA_AUDIO', 'SYSTEM_ALERT_WINDOW',
                     'ACCESS_FINE_LOCATION', 'ACCESS_COARSE_LOCATION']
          assert not any(f"'android.permission.{permission}'" in permissions for permission in blocked), permissions
          print(permissions)
          PY
          {
            echo '### Android compilation evidence'
            echo "Source: $GITHUB_SHA"
            echo 'ARM64 release-mode APK assembled with the Expo-generated development signing key.'
            echo 'This is compilation proof, not Play signing, device QA, or a beta release.'
            echo 'APK is not retained/uploaded; no build artifact storage is added by this workflow.'
          } >> "$GITHUB_STEP_SUMMARY"
