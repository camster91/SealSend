services:
  web:
    build:
      context: .
      args:
        - NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL}
        - NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY}
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL}
      - APP_URL=${APP_URL}
      - SESSION_SECRET=${SESSION_SECRET}
      - TRUST_PROXY_HEADERS=${TRUST_PROXY_HEADERS:-false}
      - MAILGUN_API_KEY=${MAILGUN_API_KEY}
      - MAILGUN_DOMAIN=${MAILGUN_DOMAIN}
      - MAILGUN_URL=${MAILGUN_URL}
      - FROM_EMAIL=${FROM_EMAIL}
      - MAILGUN_WEBHOOK_SIGNING_KEY=${MAILGUN_WEBHOOK_SIGNING_KEY}
      - TWILIO_ACCOUNT_SID=${TWILIO_ACCOUNT_SID}
      - TWILIO_API_KEY_SID=${TWILIO_API_KEY_SID}
      - TWILIO_API_KEY_SECRET=${TWILIO_API_KEY_SECRET}
      - TWILIO_MESSAGING_SERVICE_SID=${TWILIO_MESSAGING_SERVICE_SID}
      - TWILIO_FROM_NUMBER=${TWILIO_FROM_NUMBER}
      - TWILIO_WEBHOOK_URL=${TWILIO_WEBHOOK_URL}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
      - STRIPE_PRO_YEARLY_PRICE_ID=${STRIPE_PRO_YEARLY_PRICE_ID}
      - STRIPE_SILVER_MONTHLY_PRICE_ID=${STRIPE_SILVER_MONTHLY_PRICE_ID}
      - STRIPE_SILVER_YEARLY_PRICE_ID=${STRIPE_SILVER_YEARLY_PRICE_ID}
      - STRIPE_GOLD_MONTHLY_PRICE_ID=${STRIPE_GOLD_MONTHLY_PRICE_ID}
      - STRIPE_GOLD_YEARLY_PRICE_ID=${STRIPE_GOLD_YEARLY_PRICE_ID}
      - PAYMENTS_TEST_ONLY=${PAYMENTS_TEST_ONLY:-true}
      - COMMUNICATIONS_TEST_ONLY=${COMMUNICATIONS_TEST_ONLY:-true}
      - COMMUNICATIONS_ALLOWED_RECIPIENTS=${COMMUNICATIONS_ALLOWED_RECIPIENTS}
      - AI_PROVIDER=${AI_PROVIDER:-openai}
      - AI_MODEL=${AI_MODEL}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ERROR_ALERT_WEBHOOK_URL=${ERROR_ALERT_WEBHOOK_URL}
      - MONITORING_TEST_SECRET=${MONITORING_TEST_SECRET}
      - EMAIL_ESTIMATED_COST_MICROS=${EMAIL_ESTIMATED_COST_MICROS}
      - SMS_ESTIMATED_COST_MICROS=${SMS_ESTIMATED_COST_MICROS}
      - CRON_SECRET=${CRON_SECRET}
    volumes:
      - uploads_data:/app/uploads
    restart: unless-stopped

volumes:
  uploads_data:
