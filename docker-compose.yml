services:
  web:
    build:
      context: .
      args:
        - NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL}
        - NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY}
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL}
      - APP_URL=${APP_URL}
      - SESSION_SECRET=${SESSION_SECRET}
      - TRUST_PROXY_HEADERS=${TRUST_PROXY_HEADERS:-false}
      - MAILGUN_API_KEY=${MAILGUN_API_KEY}
      - MAILGUN_DOMAIN=${MAILGUN_DOMAIN}
      - MAILGUN_URL=${MAILGUN_URL}
      - FROM_EMAIL=${FROM_EMAIL}
      - TWILIO_ACCOUNT_SID=${TWILIO_ACCOUNT_SID}
      - TWILIO_API_KEY_SID=${TWILIO_API_KEY_SID}
      - TWILIO_API_KEY_SECRET=${TWILIO_API_KEY_SECRET}
      - TWILIO_MESSAGING_SERVICE_SID=${TWILIO_MESSAGING_SERVICE_SID}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
      - STRIPE_SILVER_MONTHLY_PRICE_ID=${STRIPE_SILVER_MONTHLY_PRICE_ID}
      - STRIPE_SILVER_YEARLY_PRICE_ID=${STRIPE_SILVER_YEARLY_PRICE_ID}
      - STRIPE_GOLD_MONTHLY_PRICE_ID=${STRIPE_GOLD_MONTHLY_PRICE_ID}
      - STRIPE_GOLD_YEARLY_PRICE_ID=${STRIPE_GOLD_YEARLY_PRICE_ID}
      - CRON_SECRET=${CRON_SECRET}
    volumes:
      - uploads_data:/app/uploads
    restart: unless-stopped

volumes:
  uploads_data:
